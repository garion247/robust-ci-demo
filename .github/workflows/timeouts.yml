name: Status Conditions

on:
  push:
    branches: [ master ]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Flaky step (no continue-on-error)
        id: work
        run: exit 1

      - name: Only on success
        if: success()
        run: echo "Will not run - prior step failed"

      - name: Only on failure
        if: failure()
        run: echo "Runs because work failed - good place to alert"

      - name: Only when cancelled
        if: cancelled()
        run: echo "Runs only if the workflow was cancelled by a user"

      - name: Always runs (cleanup pattern)
        if: always()
        run: echo "Runs regardless: cleanup, summary, log upload"

      - name: Selective on outcome
        if: always() && steps.work.outcome == 'failure'
        run: echo "Equivalent of failure(), but tied to a specific step"
