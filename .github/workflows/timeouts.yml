name: Continue On Error

on:
  push:
    branches: [ master ]

jobs:
  step-coe:
    runs-on: ubuntu-latest
    steps:
      - name: Flaky step (continue-on-error)
        id: flaky
        continue-on-error: true
        run: |
          echo "About to fail..."
          exit 1

      - name: Inspect the result
        run: |
          echo "outcome:    ${{ steps.flaky.outcome }}"
          echo "conclusion: ${{ steps.flaky.conclusion }}"

      - name: Done
        run: echo "Workflow continues even though flaky step failed"

  job-coe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - run: |
          echo "Whole job is set continue-on-error"
          exit 1

  after-job-coe:
    needs: job-coe
    runs-on: ubuntu-latest
    steps:
      - name: Inspect upstream result
        run: |
          echo "needs.job-coe.result: ${{ needs.job-coe.result }}"
          echo "Even though job-coe failed, this job still ran."
